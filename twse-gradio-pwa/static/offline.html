<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>目前離線中</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; text-align: center;
    }
    .card {
      width: min(92vw, 420px); padding: clamp(24px, 6vw, 40px);
      background: rgba(255,255,255,.15); backdrop-filter: blur(10px);
      border-radius: 24px; border: 1px solid rgba(255,255,255,.3);
    }
    .icon { font-size: clamp(48px, 14vw, 72px); }
    h1 { font-size: clamp(1.3rem, 5vw, 1.8rem); margin: 8px 0; }
    p  { opacity: .9; line-height: 1.6; margin: 0 0 20px; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 999px;
      padding: 12px 28px; background: #fff; color: #4f46e5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📡</div>
    <h1>目前沒有網路連線</h1>
    <p>資料需要連線才能下載。<br>請檢查網路後再試一次，連線恢復時會自動重新整理。</p>
    <button onclick="location.reload()">重新整理</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
